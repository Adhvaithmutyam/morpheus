<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" fill="none">
  <!-- India Gate Architectural Elevation -->
  <g stroke="rgba(255, 255, 255, 0.55)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground Datum & Plinth Steps -->
    <line x1="20" y1="112" x2="240" y2="112" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.7" />
    <line x1="32" y1="108" x2="228" y2="108" stroke-width="0.8" />
    <rect x="42" y="103" width="176" height="5" stroke-width="0.9" fill="rgba(255, 255, 255, 0.04)" />
    <rect x="48" y="99" width="164" height="4" stroke-width="0.9" fill="rgba(255, 255, 255, 0.06)" />

    <!-- Main Outer Pylon Piers -->
    <line x1="52" y1="99" x2="52" y2="48" stroke-width="1" />
    <line x1="208" y1="99" x2="208" y2="48" stroke-width="1" />

    <!-- Pier Outer Moldings / Corner Pilasters -->
    <line x1="58" y1="99" x2="58" y2="48" stroke="rgba(255, 255, 255, 0.3)" stroke-width="0.6" />
    <line x1="202" y1="99" x2="202" y2="48" stroke="rgba(255, 255, 255, 0.3)" stroke-width="0.6" />

    <!-- Central Arch Jambs -->
    <line x1="102" y1="99" x2="102" y2="72" stroke-width="1.1" />
    <line x1="158" y1="99" x2="158" y2="72" stroke-width="1.1" />

    <!-- Primary Arch Semicircle (Radius = 28, Apex = 44) -->
    <path d="M102 72 A28 28 0 0 1 158 72" stroke-width="1.4" stroke="rgba(255, 255, 255, 0.85)" />

    <!-- Inner Arch Depth Recess -->
    <path d="M107 99 V73 A21 21 0 0 1 153 73 V99" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.75" />

    <!-- Keystone -->
    <polygon points="127,42 133,42 132,49 128,49" fill="rgba(255, 255, 255, 0.6)" stroke="none" />

    <!-- Impost Bands (Arch Springline) -->
    <line x1="52" y1="72" x2="102" y2="72" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />
    <line x1="158" y1="72" x2="208" y2="72" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />

    <!-- Side Blind Arches / Decorative Niches -->
    <path d="M68 92 V68 A10 10 0 0 1 88 68 V92" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />
    <path d="M172 92 V68 A10 10 0 0 1 192 68 V92" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.75" />

    <!-- Lower Cornice / Entablature Architrave -->
    <line x1="46" y1="48" x2="214" y2="48" stroke-width="1.1" stroke="rgba(255, 255, 255, 0.7)" />
    <rect x="50" y="38" width="160" height="10" stroke-width="0.8" fill="rgba(255, 255, 255, 0.05)" />

    <!-- Main Projecting Cornice Shelf -->
    <line x1="44" y1="38" x2="216" y2="38" stroke-width="1.3" stroke="rgba(255, 255, 255, 0.85)" />

    <!-- Attic Tier (Inscription Block) -->
    <rect x="58" y="25" width="144" height="13" stroke-width="0.9" fill="rgba(255, 255, 255, 0.06)" />
    <line x1="54" y1="25" x2="206" y2="25" stroke-width="1.1" stroke="rgba(255, 255, 255, 0.7)" />

    <!-- Stepped Attic Crown -->
    <rect x="76" y="18" width="108" height="7" stroke-width="0.8" fill="rgba(255, 255, 255, 0.07)" />
    <line x1="72" y1="18" x2="188" y2="18" stroke-width="0.9" stroke="rgba(255, 255, 255, 0.6)" />

    <!-- Top Ceremonial Urn / Chhatri Finial -->
    <path d="M114 18 C114 11 146 11 146 18 Z" stroke-width="0.9" stroke="rgba(255, 255, 255, 0.7)" fill="rgba(255, 255, 255, 0.15)" />
    <circle cx="130" cy="10" r="1.5" fill="rgba(255, 255, 255, 0.6)" stroke="none" />
  </g>

  <!-- Formal Classical Inscription -->
  <text x="130" y="34.5" fill="rgba(255, 255, 255, 0.85)" font-family="Georgia, serif" font-size="8" font-weight="bold" letter-spacing="4.5" text-anchor="middle">INDIA</text>
</svg>